name: nx_docs
description: Internal document and essay editor for Nexus.
publish_to: "none"
version: 0.1.0+6

environment:
  sdk: ^3.9.2

dependencies:
  auto_size_text: ^3.0.0
  appflowy_editor:
    path: ../third_party/appflowy-editor
  crypto: ^3.0.6
  connectivity_plus: 6.1.5
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.11
  flutter_riverpod: ^3.2.0
  file_picker: ^10.3.10
  go_router: ^17.0.1
  google_fonts: ^8.0.2
  graphql_flutter: ^5.1.2
  http: ^1.2.2
  intl: ^0.20.2
  nx_db:
    path: ../nx_modules/nx_db
  nx_documents:
    path: ../nx_modules/nx_documents
  nx_live_agent:
    path: ../nx_modules/nx_live_agent
  nx_offline:
    path: ../nx_modules/nx_offline
  nx_voice:
    path: ../nx_modules/nx_voice
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  shorebird_code_push: ^2.0.7

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

dependency_overrides:
  connectivity_plus: 6.1.5
  # flutter_sound 9.30 advertises a broken macOS plugin. Nx Docs uses its
  # unchanged mobile implementation but intentionally omits desktop voice.
  flutter_sound:
    path: ../third_party/flutter_sound

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true
