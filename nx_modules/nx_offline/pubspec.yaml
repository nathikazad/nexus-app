publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2
  flutter: ">=3.32.0"

dependencies:
  nx_data:
    path: ../nx_data
  nx_sync:
    path: ../nx_sync
  crypto: ^3.0.6
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.2.2

dev_dependencies:
  build_runner: ^2.10.5
  drift_dev: ^2.34.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
